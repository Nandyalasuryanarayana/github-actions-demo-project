name: Top-workflow

on: [push]

jobs:
    build:
        runs-on: ubuntu-24.04
        # strategy:
        #     matrix:
        #         node: [ 20, 22, 24 ]
        name: Node ${{ matrix.node }} sample
 
        steps:
           - uses: actions/checkout@v4
           
           - name: setup nod
             uses: actions/setup-node@v6
             with:
                node-version: ${{ matrix.node }}
                package-manager-cache: false
        
           - name: install dependencies
             run: npm install
             
           - name: test the code
             run: npm test

           - name: compile code
             run: npm run build
        
        